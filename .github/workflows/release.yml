# Build the Latent Resonator standalone (Bespoke Synth fork + module) and
# publish a DRAFT GitHub release when a version tag (v*) is pushed.
#
# WARNING: THIS WORKFLOW COULD NOT BE TESTED LOCALLY. Its building blocks
# (scripts/apply_module.sh, scripts/package_macos.sh) were exercised on a
# scratch copy, but the cmake build on the macos-14 runner and the release
# step have never run. Expect to iterate on the first tag (try a v0.0.0-rc1).
#
# Uses only the default GITHUB_TOKEN.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build macOS arm64 and draft release
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: project

      - name: Read pinned Bespoke commit
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          . project/bespoke-migration/patches/BESPOKE_BASE.txt
          echo "repo=${BESPOKE_REPO}" >> "$GITHUB_OUTPUT"
          echo "commit=${BESPOKE_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: Clone upstream Bespoke Synth at the pinned commit
        shell: bash
        env:
          BESPOKE_REPO: ${{ steps.pin.outputs.repo }}
          BESPOKE_COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          set -euo pipefail
          git clone "$BESPOKE_REPO" bespoke
          git -C bespoke checkout "$BESPOKE_COMMIT"
          git -C bespoke submodule update --init --recursive

      - name: Apply module and JUCE patch
        run: project/scripts/apply_module.sh bespoke

      - name: Configure
        run: |
          cmake -S bespoke -B bespoke/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build bespoke/build --config Release --parallel 4

      - name: Package
        id: package
        shell: bash
        env:
          BUILD_DIR: ${{ github.workspace }}/bespoke/build
          OUT_DIR: ${{ github.workspace }}/dist
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          project/scripts/package_macos.sh
          zip_path="$(ls dist/LatentResonator-*-macOS-arm64.zip)"
          echo "zip=${zip_path}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 -c ./*.sha256
          cat ./*.sha256

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          ZIP: ${{ steps.package.outputs.zip }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ZIP" "$ZIP.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --title "Latent Resonator $TAG"
