name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BRIDGE_DIR: bespoke-migration/ace-bridge

jobs:
  test-python:
    name: Test (bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy pytest flask soundfile

      - name: Run tests
        run: pytest ${{ env.BRIDGE_DIR }}/test_bridge.py -v

  lint-python:
    name: Lint (bridge)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install black flake8 pip-audit

      - name: Audit dependencies
        run: pip-audit -r ${{ env.BRIDGE_DIR }}/requirements_bridge.txt

      - name: Black
        run: black --check ${{ env.BRIDGE_DIR }}

      - name: Flake8
        run: flake8 ${{ env.BRIDGE_DIR }}
